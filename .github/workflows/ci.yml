name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  offline-tests:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run offline Maven tests
        run: ./mvnw -q test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ling-AI-CODE-generation-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ling-AI-CODE-generation-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
